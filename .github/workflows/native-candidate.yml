name: hcode native candidates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build:native
      - name: Prove host-native artifact
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: node scripts/verify-native-manifest.mjs dist/native/native-manifest.json
      - if: matrix.target == 'linux-x64'
        run: npm pack --dry-run --json
      - uses: actions/upload-artifact@v4
        with:
          name: hcode-${{ matrix.target }}
          path: dist/native/
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: assemble exact release candidate
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: hcode-*
          path: dist/runners
      - run: node scripts/assemble-native-release.mjs dist/runners dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: hcode-native-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

# Deliberately no tag, Release or npm publication permission. Candidate evidence becomes public
# only through a separately owner-authorized exact-commit release step.
